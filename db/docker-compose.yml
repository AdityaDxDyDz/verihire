# Local Postgres + pgvector for backend development and tests.
#   docker compose -f db/docker-compose.yml up -d
# (The full-app docker-compose.yml at repo root is owned by Kadam.)
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: verihire
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
    volumes: [verihire_pg:/var/lib/postgresql/data]
volumes:
  verihire_pg:
